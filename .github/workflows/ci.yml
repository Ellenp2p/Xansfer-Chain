name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies (workspace)
        run: bun install --frozen-lockfile
      - name: Unit tests
        working-directory: frontend
        run: bun run test
      - name: Build wallet-connect package and frontend
        env:
          VITE_BASE: /Xansfer-Chain/
        run: bun run build

  backend:
    name: Backend check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
      - name: cargo check
        run: cargo check --manifest-path backend/Cargo.toml --all-targets
