[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.25"
optimizer = true
optimizer_runs = 200
via_ir = true

gas_reports = ["CctpV2Forwarder"]

[fmt]
line_length = 120

[invariant]
runs = 256
depth = 32
fail_on_revert = false

[profile.ci]
fuzz = { runs = 10_000 }
invariant = { runs = 512, depth = 64 }
